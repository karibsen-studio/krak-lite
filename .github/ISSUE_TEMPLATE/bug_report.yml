name: 🐛 Bug report
description: Report something that isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug! Please fill in the details below.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps to reproduce, or a link to a minimal reproduction (StackBlitz / repo).
      placeholder: |
        1. Configure krakLite with '...'
        2. Call track('...')
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: module-version
    attributes:
      label: "@karibsen/krak-lite-nuxt version"
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: nuxt-version
    attributes:
      label: Nuxt version
      placeholder: 4.4.8
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, package manager, OS, browser, and the output of `npx nuxi info` if possible.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / console output
      description: Paste any relevant logs (enable `debug: true` in the module options for more detail).
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I am using the latest released version
          required: true
