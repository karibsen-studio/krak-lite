name: ✨ Feature request
description: Suggest an idea or improvement for krak-lite
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thanks for the suggestion! Please describe what you'd like to see.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem are you trying to solve? Why is the current behaviour insufficient?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature or API you'd like. Code/config examples welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you've thought about.
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Where does this fit?
      options:
        - Client tracking / API
        - Declarative (data-krak-*) capture
        - Privacy / data handling
        - Transport / delivery
        - Server-side ingestion
        - DevTools / DX
        - Other
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: This stays aligned with krak-lite's privacy-first, lightweight goals
          required: false
